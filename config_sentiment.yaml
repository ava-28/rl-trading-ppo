# =============================================================================
# rl_trading_v2 — SECONDARY STUDY (exploratory sentiment sub-study)
# =============================================================================
# EXPLORATORY. Do not report conclusions from this as if they were the primary
# result.
#
# Finnhub's free tier returns roughly 12 months of company news — verified with
# probe_news.py on 2026-08-09, earliest month with data was 2025-08. That gives
# ~250 trading days total, which supports one train/test split with a ~70-day
# test window. A Sharpe ratio estimated over 70 days has confidence intervals
# wide enough to contain almost any effect, so this study can indicate a
# direction but cannot establish one.
#
# It exists to answer a narrow question: does adding FinBERT news sentiment
# change behaviour at all, on the only window where news is available?
#
#   1 fold x 2 ablations x 5 seeds = 10 training runs (~1-2 hours)
#
# Run (after the primary study finishes):
#   export FINNHUB_KEY="your_key"
#   python experiments/run_suite.py --config config_sentiment.yaml
# =============================================================================

assets:
  tech:    [AAPL, NVDA, MSFT]
  finance: [JPM]
  energy:  [XOM]
  etf:     [SPY, QQQ]

tickers: [AAPL, NVDA, MSFT, JPM, XOM, SPY, QQQ]

vix_ticker: "^VIX"

data:
  source: yfinance
  finnhub_key: ""                  # read from FINNHUB_KEY environment variable
  skip_news: false
  cache_dir: "data/cache_v2"
  force_refetch: false

# ---------------------------------------------------------------------------
# Single fold, bounded by news availability.
# Train ~9 months, test ~3.5 months. Thin, and labelled as such.
# ---------------------------------------------------------------------------
walk_forward:
  - id: fold_news
    train_start: "2025-08-01"
    train_end:   "2026-04-30"
    test_start:  "2026-05-01"
    test_end:    "2026-08-09"

features:
  lookback_returns: 5
  rsi_window: 14
  ma_short: 20
  ma_long:  50
  vol_window: 10
  normalize: zscore
  obs_noise_std: 0.01

sentiment:
  backend: finbert                 # requires: pip install transformers
  model: "ProsusAI/finbert"
  aggregation: ewm
  ewm_halflife: 3
  max_articles_per_day: 5
  no_future_leakage: true          # CRITICAL — headlines align causally to t+1

env:
  initial_cash: 10000.0
  shares_per_trade: 1
  max_shares_long: 5
  max_shares_short: 5
  commission: 0.50
  slippage_pct: 0.001
  bid_ask_half_spread: 0.0005
  borrow_cost_annual: 0.02
  max_position_pct: 0.30
  execution_lag: 1
  episode_randomize_start: true
  min_episode_length: 40           # lowered: the training window is short

reward:
  lambda_drawdown: 0.02
  drawdown_threshold: 0.05
  mu_turnover: 0.001
  holding_penalty_steps: 20
  holding_penalty_rate: 0.003

ppo:
  hidden_size: 256
  num_layers: 2
  dropout: 0.10
  lr: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.20
  epochs: 4
  minibatch_size: 64
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  normalize_advantages: true

training:
  num_episodes: 300                # fewer: less data, overfits faster
  eval_freq: 25
  num_seeds: 5
  seeds: [42, 123, 456, 789, 2024]
  checkpoint_dir: "checkpoints_sentiment"
  device: auto

results_dir: "results_sentiment"

# ---------------------------------------------------------------------------
# Exactly two configurations — the only comparison this data can support.
# ---------------------------------------------------------------------------
ablations:
  - id: with_sentiment
    use_sentiment: true
    use_short_selling: true
    use_risk_reward: true
    action_noise: true

  - id: no_sentiment
    use_sentiment: false
    use_short_selling: true
    use_risk_reward: true
    action_noise: true

metrics:
  - total_return
  - annualized_return
  - sharpe_ratio
  - sortino_ratio
  - max_drawdown
  - calmar_ratio
  - win_rate
  - turnover
  - num_trades
